<!doctype html>
<html lang="en" class="h-full{% if request.user.is_authenticated and request.user.profile.high_contrast_mode %} high-contrast{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Recovery Pulse{% endblock %}</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="{% url 'manifest' %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6',
              600: '#0d9488', 700: '#0f766e', 900: '#134e4a',
            },
          },
        },
      },
    }
  </script>
  <style>
    /* High-contrast mode (accounts.Profile.high_contrast_mode) — overrides
       the small set of Tailwind utility classes used throughout the app
       with a forced black/white/yellow palette. */
    html.high-contrast body { background: #000 !important; color: #fff !important; }
    html.high-contrast .bg-brand-50,
    html.high-contrast .bg-brand-100,
    html.high-contrast .bg-white { background: #000 !important; }
    html.high-contrast .text-slate-800,
    html.high-contrast .text-slate-700,
    html.high-contrast .text-slate-600,
    html.high-contrast .text-slate-500,
    html.high-contrast .text-slate-400 { color: #fff !important; }
    html.high-contrast .border-slate-200,
    html.high-contrast .border-slate-300 { border-color: #fff !important; border-width: 2px !important; }
    html.high-contrast .bg-brand-600,
    html.high-contrast .bg-brand-700 { background: #ffeb3b !important; color: #000 !important; }
    html.high-contrast .text-brand-700,
    html.high-contrast .text-brand-800 { color: #ffeb3b !important; }
    html.high-contrast .border-brand-200,
    html.high-contrast .border-brand-600 { border-color: #ffeb3b !important; }
    html.high-contrast .bg-red-50 { background: #000 !important; }
    html.high-contrast .text-red-700,
    html.high-contrast .text-red-800 { color: #ff5252 !important; }
    html.high-contrast .border-red-200,
    html.high-contrast .border-red-300 { border-color: #ff5252 !important; }
    html.high-contrast .text-amber-600 { color: #ffeb3b !important; }
    html.high-contrast .text-green-600 { color: #69f0ae !important; }
    html.high-contrast a, html.high-contrast button { text-decoration: underline; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-brand-50 text-slate-900 antialiased">
  {% if messages %}
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-4 space-y-2">
      {% for message in messages %}
        <div class="rounded-lg px-4 py-3 text-sm shadow-sm
          {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
          {% else %}bg-brand-50 text-brand-800 border border-brand-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
